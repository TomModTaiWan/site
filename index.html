<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TomModTaiWan</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    color: #fff;
    background: #000;
}

/* VIDEO NỀN */
.background-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -10;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .18);
    z-index: -5;
}

/* PROFILE */
.profile {
    position: relative;
    z-index: 2;

    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding: 45px 16px 90px;
}

/* AVATAR */
.avatar {
    width: 105px;
    height: 105px;

    object-fit: cover;
    border-radius: 50%;

    border: 3px solid rgba(255,255,255,.95);

    background: #111;

    box-shadow:
        0 0 8px rgba(255,255,255,.8),
        0 0 22px rgba(255,255,255,.35),
        0 5px 25px rgba(0,0,0,.7);
}

/* TÊN */
.name-row {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 7px;
    margin-top: 13px;
}

.name {
    font-size: 26px;
    font-weight: 800;
    color: #fff;

    text-shadow:
        0 2px 8px rgba(0,0,0,.95),
        0 0 3px rgba(255,255,255,.35);
}

/* TÍCH XANH */
.verified {
    width: 20px;
    height: 20px;
    min-width: 20px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    background: #1d9bf0;
    color: #fff;

    border-radius: 50%;

    font-size: 13px;
    font-weight: 900;
    line-height: 1;

    box-shadow:
        0 2px 7px rgba(29,155,240,.45),
        0 0 8px rgba(29,155,240,.25);
}

/* BIO */
.bio {
    margin-top: 8px;

    font-size: 15px;
    color: #fff;

    text-align: center;

    text-shadow:
        0 2px 8px rgba(0,0,0,.95);
}

/* CÁC LINK */
.links {
    width: min(360px, 88vw);

    margin-top: 24px;

    display: flex;
    flex-direction: column;

    gap: 11px;
}

/* NÚT LINK */
.link {
    position: relative;

    width: 100%;
    min-height: 54px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 12px 18px;

    color: #fff;
    text-decoration: none;

    font-size: 15px;
    font-weight: 700;
    letter-spacing: .2px;

    border: 1.5px solid rgba(0,229,255,.85);
    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(15,35,70,.72),
            rgba(70,25,100,.58)
        );

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    box-shadow:
        0 0 8px rgba(0,229,255,.45),
        inset 0 0 10px rgba(0,229,255,.08);

    text-shadow:
        0 1px 5px rgba(0,0,0,.9);

    overflow: hidden;

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

/* ÁNH SÁNG CHẠY */
.link::before {
    content: "";

    position: absolute;
    top: 0;
    left: -120%;

    width: 70%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );

    transform: skewX(-20deg);

    transition: left .55s ease;

    pointer-events: none;
}

.link:hover::before,
.link:focus::before {
    left: 150%;
}

/* CHẠM */
.link:active {
    transform: scale(.96);

    background:
        linear-gradient(
            135deg,
            rgba(0,229,255,.25),
            rgba(140,60,255,.25)
        );

    box-shadow:
        0 0 10px rgba(0,229,255,.75),
        0 0 22px rgba(0,229,255,.3),
        inset 0 0 14px rgba(255,255,255,.12);
}

/* HIỆU ỨNG RIPPLE */
.ripple {
    position: absolute;

    border-radius: 50%;

    transform: scale(0);

    animation: rippleEffect .55s linear;

    background: rgba(255,255,255,.3);

    pointer-events: none;
}

@keyframes rippleEffect {
    to {
        transform: scale(5);
        opacity: 0;
    }
}

/* NÚT NHẠC */
.music-button {
    position: fixed;

    right: 16px;
    bottom: 16px;

    width: 48px;
    height: 48px;

    border-radius: 50%;

    border: 1px solid rgba(0,210,255,.85);

    background: rgba(0,20,40,.78);

    color: #fff;

    font-size: 19px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 20;

    box-shadow:
        0 0 8px rgba(0,190,255,.7),
        0 0 18px rgba(0,130,255,.35);

    transition:
        transform .15s ease,
        box-shadow .15s ease;
}

.music-button:active {
    transform: scale(.88);

    box-shadow:
        0 0 15px rgba(0,220,255,1),
        0 0 30px rgba(0,150,255,.8);
}

/* MOBILE */
@media (max-width: 480px) {

    .profile {
        padding-top: 38px;
    }

    .avatar {
        width: 100px;
        height: 100px;
    }

    .name {
        font-size: 25px;
    }

    .bio {
        font-size: 15px;
    }

    .links {
        width: min(360px, 88vw);
        gap: 11px;
        margin-top: 22px;
    }

    .link {
        min-height: 54px;
        font-size: 15px;
        border-radius: 22px;
    }
}
</style>
</head>

<body>

<!-- VIDEO NỀN -->
<video
    class="background-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
>
    <source
        src="tiktok_video_no_watermark.mp4"
        type="video/mp4"
    >
</video>

<div class="overlay"></div>


<!-- PROFILE -->
<main class="profile">

    <img
        class="avatar"
        src="avatar.png"
        alt="TomModTaiWan"
    >

    <div class="name-row">

        <span class="name">
            TomModTaiWan
        </span>

        <span
            class="verified"
            aria-label="Verified"
        >✓</span>

    </div>

    <p class="bio">
        TomModTaiWan. Xin Kính Chào Bạn.
    </p>


    <!-- LINKS -->
    <div class="links">

        <a
            class="link"
            href="https://www.facebook.com/share/1cQg31DP2L/"
            target="_blank"
            rel="noopener noreferrer"
        >
            Facebook
        </a>

        <a
            class="link"
            href="https://www.tiktok.com/@tluocc_010"
            target="_blank"
            rel="noopener noreferrer"
        >
            TikTok
        </a>

        <a
            class="link"
            href="https://discord.gg/xhc"
            target="_blank"
            rel="noopener noreferrer"
        >
            Discord
        </a>

        <a
            class="link"
            href="https://t.me/tluoc_09"
            target="_blank"
            rel="noopener noreferrer"
        >
            Telegram
        </a>

        <a
            class="link"
            href="https://linkbio.co/8070700OwKBiF"
            target="_blank"
            rel="noopener noreferrer"
        >
            Link Bio
        </a>

    </div>

</main>


<!-- NÚT NHẠC -->
<button
    class="music-button"
    id="musicButton"
    aria-label="Bật hoặc tắt nhạc"
>
    🔇
</button>

<audio
    id="music"
    loop
    preload="auto"
>
    <source
        src="tiktok_mp3.mp3"
        type="audio/mpeg"
    >
</audio>


<script>

/* RIPPLE KHI NHẤN LINK */
document.querySelectorAll(".link").forEach(function(button) {

    button.addEventListener("click", function(event) {

        const circle = document.createElement("span");

        const rect = button.getBoundingClientRect();

        const size = Math.max(
            rect.width,
            rect.height
        );

        circle.classList.add("ripple");

        circle.style.width = size + "px";
        circle.style.height = size + "px";

        circle.style.left =
            (event.clientX - rect.left - size / 2) + "px";

        circle.style.top =
            (event.clientY - rect.top - size / 2) + "px";

        button.appendChild(circle);

        setTimeout(function() {
            circle.remove();
        }, 600);

    });

});


/* NHẠC */
const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");

musicButton.addEventListener("click", function() {

    if (music.paused) {

        music.play()
            .then(function() {

                musicButton.textContent = "🔊";

            })
            .catch(function() {

                musicButton.textContent = "🔇";

            });

    } else {

        music.pause();

        musicButton.textContent = "🔇";

    }

});

</script>

</body>
    </html>
