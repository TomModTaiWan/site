<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TomModTaiWan</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background: #000;
}

/* VIDEO NỀN */
.background-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -3;
}

/* LỚP PHỦ NHẸ */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.25);
    z-index: -2;
}

/* PROFILE */
.profile {
    position: relative;
    z-index: 2;

    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

/* AVATAR */
.avatar {
    width: 105px;
    height: 105px;

    border-radius: 50%;
    object-fit: cover;

    border: 3px solid white;

    box-shadow:
        0 5px 25px rgba(0, 0, 0, 0.6);
}

/* TÊN + TÍCH XANH */
.name-row {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 6px;

    margin-top: 12px;
}

.name {
    font-size: 26px;
    font-weight: 800;

    text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.9);
}

/* TÍCH XANH NHỎ */
.verified {
    width: 18px;
    height: 18px;

    min-width: 18px;

    border-radius: 50%;

    background: #1d9bf0;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;

    font-size: 12px;
    font-weight: 900;

    box-shadow:
        0 1px 6px rgba(0, 0, 0, 0.5);
}

/* BIO */
.bio {
    margin-top: 7px;

    font-size: 15px;

    text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.9);
}

/* LINK */
.links {
    width: min(420px, 92vw);

    display: flex;
    flex-direction: column;

    gap: 11px;

    margin-top: 24px;
}

.link {
    width: 100%;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    text-decoration: none;

    font-size: 16px;
    font-weight: 700;

    border-radius: 15px;

    border: 1px solid rgba(255, 255, 255, 0.3);

    background: rgba(0, 0, 0, 0.38);

    backdrop-filter: blur(8px);

    text-shadow:
        0 1px 5px rgba(0, 0, 0, 0.9);

    box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.25);

    transition: 0.2s;
}

.link:hover {
    transform: scale(1.025);
    background: rgba(255, 255, 255, 0.18);
}

/* NÚT NHẠC */
.music-button {
    position: fixed;

    right: 18px;
    bottom: 18px;

    width: 45px;
    height: 45px;

    border-radius: 50%;

    border: 1px solid rgba(255, 255, 255, 0.35);

    background: rgba(0, 0, 0, 0.55);

    color: white;

    font-size: 19px;

    cursor: pointer;

    z-index: 10;
}
</style>
</head>

<body>

<!-- VIDEO NỀN -->
<video
    class="background-video"
    autoplay
    muted
    loop
    playsinline
>
    <source
        src="tiktok_video_no_watermark.mp4"
        type="video/mp4"
    >
</video>

<div class="overlay"></div>


<!-- PROFILE -->
<main class="profile">

    <!-- AVATAR -->
    <img
        class="avatar"
        src="avatar.jpg"
        alt="TomModTaiWan"
    >


    <!-- TÊN -->
    <div class="name-row">

        <span class="name">
            TomModTaiWan
        </span>

        <span
            class="verified"
            title="Verified"
        >
            ✓
        </span>

    </div>


    <!-- BIO -->
    <p class="bio">
        Welcome to my profile ✨
    </p>


    <!-- CÁC LINK -->
    <div class="links">

        <a
            class="link"
            href="https://www.facebook.com/share/1cQg31DP2L/"
            target="_blank"
            rel="noopener noreferrer"
        >
            Facebook
        </a>


        <a
            class="link"
            href="https://www.tiktok.com/@tluocc_010"
            target="_blank"
            rel="noopener noreferrer"
        >
            TikTok
        </a>


        <a
            class="link"
            href="https://discord.gg/xhc"
            target="_blank"
            rel="noopener noreferrer"
        >
            Discord
        </a>


        <a
            class="link"
            href="https://t.me/tluoc_09"
            target="_blank"
            rel="noopener noreferrer"
        >
            Telegram
        </a>


        <a
            class="link"
            href="https://linkbio.co/8070700OwKBiF"
            target="_blank"
            rel="noopener noreferrer"
        >
            Link Bio
        </a>

    </div>

</main>


<!-- NÚT NHẠC -->
<button
    class="music-button"
    id="musicButton"
>
    🔇
</button>


<audio
    id="music"
    loop
>
    <source
        src="music.mp3"
        type="audio/mpeg"
    >
</audio>


<script>

const music =
    document.getElementById("music");

const button =
    document.getElementById("musicButton");


button.addEventListener("click", function () {

    if (music.paused) {

        music.play();

        button.textContent = "🔊";

    } else {

        music.pause();

        button.textContent = "🔇";

    }

});

</script>

</body>
</html>
