<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>TomModTaiWan</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #050509;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =========================
   VIDEO NỀN
========================= */

.background-video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: -10;
}

.background-overlay {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(255, 0, 60, .08),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            rgba(0, 0, 0, .15),
            rgba(0, 0, 0, .38)
        );

    z-index: -5;
}


/* =========================
   ÁNH SÁNG CHUYỂN ĐỘNG
========================= */

.light {
    position: fixed;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(0, 220, 255, .13),
            transparent 70%
        );

    filter: blur(15px);

    pointer-events: none;

    z-index: -2;

    animation: floatingLight 8s ease-in-out infinite;
}

.light.one {
    top: 10%;
    left: -100px;
}

.light.two {
    right: -100px;
    bottom: 15%;

    animation-delay: -4s;
}

@keyframes floatingLight {

    0%,
    100% {
        transform: translate(0, 0) scale(1);
    }

    50% {
        transform: translate(40px, -30px) scale(1.15);
    }
}


/* =========================
   CONTAINER
========================= */

.profile {
    position: relative;

    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding:
        48px
        16px
        80px;

    z-index: 2;
}


/* =========================
   AVATAR
========================= */

.avatar-box {
    position: relative;

    width: 112px;
    height: 112px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.avatar-box::before {
    content: "";

    position: absolute;

    width: 112px;
    height: 112px;

    border-radius: 50%;

    background:
        conic-gradient(
            #00eaff,
            #ffffff,
            #8b5cff,
            #00eaff
        );

    animation: avatarGlow 4s linear infinite;

    filter:
        drop-shadow(0 0 6px rgba(0,234,255,.9))
        drop-shadow(0 0 18px rgba(0,234,255,.45));
}

.avatar-box::after {
    content: "";

    position: absolute;

    width: 105px;
    height: 105px;

    border-radius: 50%;

    background: #050509;
}

.avatar {
    position: relative;

    width: 101px;
    height: 101px;

    object-fit: cover;

    border-radius: 50%;

    z-index: 2;

    border: 2px solid white;

    box-shadow:
        0 0 8px rgba(255,255,255,.8),
        0 0 22px rgba(0,220,255,.35);
}

@keyframes avatarGlow {

    to {
        transform: rotate(360deg);
    }
}


/* =========================
   TÊN
========================= */

.name-row {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 8px;

    margin-top: 15px;
}

.name {
    font-size: 27px;

    font-weight: 850;

    color: white;

    text-shadow:
        0 2px 8px rgba(0,0,0,.95),
        0 0 14px rgba(255,255,255,.18);
}


/* =========================
   TÍCH XANH
========================= */

.verified {
    width: 21px;
    height: 21px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #1d9bf0;

    color: white;

    font-size: 14px;
    font-weight: 900;

    line-height: 1;

    box-shadow:
        0 0 7px rgba(29,155,240,.8),
        0 0 15px rgba(29,155,240,.35);
}


/* =========================
   BIO
========================= */

.bio {
    margin-top: 9px;

    font-size: 15px;

    text-align: center;

    color: rgba(255,255,255,.96);

    text-shadow:
        0 2px 8px rgba(0,0,0,.95);
}


/* =========================
   TRẠNG THÁI
========================= */

.status {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    margin-top: 12px;

    padding: 6px 13px;

    border: 1px solid rgba(0,255,180,.35);

    border-radius: 30px;

    background:
        rgba(0,30,25,.42);

    backdrop-filter: blur(10px);
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #00ff9d;

    box-shadow:
        0 0 8px #00ff9d;

    animation: statusPulse 1.5s infinite;
}

.status-text {
    font-size: 11px;

    font-weight: 700;

    letter-spacing: 1px;

    color: #baffea;
}

@keyframes statusPulse {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .45;
        transform: scale(.7);
    }
}


/* =========================
   LINKS
========================= */

.links {
    width: min(380px, 90vw);

    display: flex;
    flex-direction: column;

    gap: 12px;

    margin-top: 25px;
}


/* =========================
   LINK BUTTON
========================= */

.link {
    position: relative;

    min-height: 55px;

    width: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 12px 20px;

    overflow: hidden;

    text-decoration: none;

    color: white;

    font-size: 15px;

    font-weight: 750;

    letter-spacing: .3px;

    border-radius: 19px;

    border:
        1px solid
        rgba(0,229,255,.78);

    background:
        linear-gradient(
            120deg,
            rgba(5,35,75,.76),
            rgba(75,20,90,.66),
            rgba(20,50,85,.72)
        );

    backdrop-filter: blur(13px);
    -webkit-backdrop-filter: blur(13px);

    box-shadow:
        0 0 8px rgba(0,229,255,.38),
        inset 0 0 14px rgba(255,255,255,.04);

    text-shadow:
        0 2px 6px rgba(0,0,0,.9);

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
}


/* ánh sáng chạy ngang */

.link::before {
    content: "";

    position: absolute;

    top: 0;
    left: -130%;

    width: 65%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.28),
            transparent
        );

    transform: skewX(-22deg);

    transition: left .6s ease;

    pointer-events: none;
}

.link:hover::before {
    left: 150%;
}


/* viền sáng */

.link:hover {
    transform: translateY(-2px);

    border-color:
        rgba(0,238,255,1);

    box-shadow:
        0 0 12px rgba(0,229,255,.65),
        0 0 25px rgba(0,229,255,.2),
        inset 0 0 18px rgba(0,229,255,.08);
}


/* khi chạm */

.link:active {
    transform: scale(.95);

    box-shadow:
        0 0 15px rgba(0,229,255,.85),
        inset 0 0 20px rgba(0,229,255,.15);
}


/* =========================
   ICON
========================= */

.link-icon {
    position: absolute;

    left: 17px;

    width: 28px;
    height: 28px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 9px;

    background:
        rgba(255,255,255,.08);

    font-size: 15px;
}


/* =========================
   RIPPLE
========================= */

.ripple {
    position: absolute;

    border-radius: 50%;

    background:
        rgba(255,255,255,.3);

    transform: scale(0);

    animation:
        ripple .55s linear;

    pointer-events: none;
}

@keyframes ripple {

    to {
        transform: scale(5);
        opacity: 0;
    }
}


/* =========================
   FOOTER
========================= */

.footer {
    margin-top: 25px;

    font-size: 10px;

    letter-spacing: 1px;

    color:
        rgba(255,255,255,.55);

    text-shadow:
        0 2px 6px rgba(0,0,0,.9);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    .profile {
        padding-top: 40px;
    }

    .avatar-box,
    .avatar-box::before {
        width: 105px;
        height: 105px;
    }

    .avatar-box::after {
        width: 98px;
        height: 98px;
    }

    .avatar {
        width: 94px;
        height: 94px;
    }

    .name {
        font-size: 25px;
    }

    .bio {
        font-size: 15px;
    }

    .links {
        width: 90vw;

        gap: 11px;

        margin-top: 22px;
    }

    .link {
        min-height: 54px;

        font-size: 15px;

        border-radius: 19px;
    }
}

</style>

</head>


<body>

<script>

/* =========================
   RIPPLE
========================= */

document
.querySelectorAll(".link")
.forEach(function(button) {

    button.addEventListener(
        "click",
        function(event) {

            const rect =
                button.getBoundingClientRect();

            const size =
                Math.max(
                    rect.width,
                    rect.height
                );

            const ripple =
                document.createElement("span");

            ripple.className = "ripple";

            ripple.style.width =
                size + "px";

            ripple.style.height =
                size + "px";

            ripple.style.left =
                (
                    event.clientX
                    -
                    rect.left
                    -
                    size / 2
                ) + "px";

            ripple.style.top =
                (
                    event.clientY
                    -
                    rect.top
                    -
                    size / 2
                ) + "px";

            button.appendChild(ripple);

            setTimeout(function() {

                ripple.remove();

            }, 600);

        }
    );

});


/* =========================
   AUTO MUSIC
========================= */

const music =
    document.getElementById("music");


function startMusic() {

    music.volume = 1;

    music.play()
    .catch(function() {

        console.log(
            "Autoplay bị trình duyệt chặn."
        );

    });

}


/* thử phát ngay */

window.addEventListener(
    "load",
    function() {

        startMusic();

    }
);


/* nếu trình duyệt chặn,
   chạm lần đầu sẽ phát */

document.addEventListener(
    "pointerdown",
    function() {

        if (music.paused) {

            startMusic();

        }

    },
    {
        once: true
    }
);

</script>
