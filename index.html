<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TomModTaiWan</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;
    background: #000;
}

/* =========================
   VIDEO NỀN
========================= */

.background-video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: -10;
}

/* Lớp tối rất nhẹ */
.overlay {
    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.20);

    z-index: -5;
}

/* =========================
   PROFILE
========================= */

.profile {
    position: relative;
    z-index: 2;

    width: 100%;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 20px 15px;
}

/* =========================
   AVATAR
========================= */

.avatar {
    width: 105px;
    height: 105px;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid rgba(255,255,255,0.95);

    background: #111;

    box-shadow:
        0 0 8px rgba(255,255,255,0.7),
        0 0 25px rgba(255,255,255,0.25),
        0 5px 25px rgba(0,0,0,0.7);
}

/* =========================
   TÊN
========================= */

.name-row {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 7px;

    margin-top: 13px;
}

.name {
    font-size: 26px;

    font-weight: 800;

    color: #fff;

    text-shadow:
        0 2px 8px rgba(0,0,0,0.95),
        0 0 3px rgba(255,255,255,0.35);
}

/* =========================
   TÍCH XANH
========================= */

.verified {
    position: relative;

    width: 19px;
    height: 19px;

    min-width: 19px;

    border-radius: 50%;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #55c9ff 0%,
            #168ff0 45%,
            #0877d5 100%
        );

    color: #fff;

    font-family: Arial, Helvetica, sans-serif;

    font-size: 12px;

    font-weight: 900;

    line-height: 1;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.65),
        inset 0 -1px 2px rgba(0,0,0,0.25),
        0 1px 5px rgba(0,0,0,0.65);

    text-shadow:
        0 1px 1px rgba(0,0,0,0.25);
}

.verified::after {
    content: "";

    position: absolute;

    inset: 1px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,0.22);

    pointer-events: none;
}

/* =========================
   BIO
========================= */

.bio {
    margin-top: 7px;

    font-size: 15px;

    color: #fff;

    text-shadow:
        0 2px 8px rgba(0,0,0,0.95);
}

/* =========================
   LINK CONTAINER
========================= */

.links {
    width: min(620px, 92vw);

    display: flex;

    flex-direction: column;

    gap: 14px;

    margin-top: 27px;
}

/* =========================
   LINK BUTTON
========================= */

.link {
    position: relative;

    width: 100%;

    height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    color: #fff;

    text-decoration: none;

    font-size: 17px;

    font-weight: 700;

    letter-spacing: 0.1px;

    border-radius: 30px;

    border: 1.5px solid rgba(0, 210, 255, 0.95);

    background:
        linear-gradient(
            135deg,
            rgba(0, 125, 255, 0.48),
            rgba(0, 45, 130, 0.38)
        );

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    box-shadow:
        0 0 7px rgba(0,190,255,0.9),
        0 0 18px rgba(0,150,255,0.55),
        inset 0 0 12px rgba(0,210,255,0.18);

    text-shadow:
        0 1px 5px rgba(0,0,0,0.9);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;
}

/* Ánh sáng chạy ngang */
.link::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 70%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.25),
            transparent
        );

    transform: skewX(-20deg);

    transition: left 0.55s ease;

    pointer-events: none;
}

.link:hover::before,
.link:focus::before {
    left: 150%;
}

/* Hiệu ứng chạm */
.link:active {
    transform: scale(0.965);

    background:
        linear-gradient(
            135deg,
            rgba(0,180,255,0.75),
            rgba(0,70,180,0.65)
        );

    box-shadow:
        0 0 10px rgba(0,220,255,1),
        0 0 30px rgba(0,170,255,0.9),
        inset 0 0 18px rgba(255,255,255,0.18);
}

/* =========================
   RIPPLE KHI CHẠM
========================= */

.ripple {
    position: absolute;

    border-radius: 50%;

    transform: scale(0);

    animation: rippleEffect 0.55s linear;

    background: rgba(255,255,255,0.35);

    pointer-events: none;
}

@keyframes rippleEffect {
    to {
        transform: scale(5);

        opacity: 0;
    }
}

/* =========================
   NÚT NHẠC
========================= */

.music-button {
    position: fixed;

    right: 18px;
    bottom: 18px;

    width: 46px;
    height: 46px;

    border-radius: 50%;

    border: 1px solid rgba(0,210,255,0.8);

    background:
        rgba(0,20,40,0.75);

    color: #fff;

    font-size: 19px;

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 20;

    box-shadow:
        0 0 8px rgba(0,190,255,0.7),
        0 0 18px rgba(0,130,255,0.35);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.music-button:active {
    transform: scale(0.88);

    box-shadow:
        0 0 15px rgba(0,220,255,1),
        0 0 30px rgba(0,150,255,0.8);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 480px) {

    .avatar {
        width: 105px;
        height: 105px;
    }

    .name {
        font-size: 26px;
    }

    .links {
        width: 92vw;

        gap: 14px;
    }

    .link {
        height: 58px;

        font-size: 17px;

        border-radius: 30px;
    }
}
</style>
</head>

<body>

<!-- =========================
     VIDEO NỀN
========================= -->

<video
    class="background-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
>
    <source
        src="tiktok_video_no_watermark.mp4"
        type="video/mp4"
    >
</video>

<div class="overlay"></div>


<!-- =========================
     PROFILE
========================= -->

<main class="profile">

    <img
        class="avatar"
        src="avatar.jpg"
        alt="TomModTaiWan"
    >

    <div class="name-row">

        <span class="name">
            TomModTaiWan
        </span>

        <span
            class="verified"
            aria-label="Verified"
        >
            ✓
        </span>

    </div>

    <p class="bio">
        Welcome to my profile ✨
    </p>


    <!-- =========================
         LINKS
    ========================= -->

    <div class="links">

        <a
            class="link"
            href="https://www.facebook.com/share/1cQg31DP2L/"
            target="_blank"
            rel="noopener noreferrer"
        >
            Facebook
        </a>

        <a
            class="link"
            href="https://www.tiktok.com/@tluocc_010"
            target="_blank"
            rel="noopener noreferrer"
        >
            TikTok
        </a>

        <a
            class="link"
            href="https://discord.gg/xhc"
            target="_blank"
            rel="noopener noreferrer"
        >
            Discord
        </a>

        <a
            class="link"
            href="https://t.me/tluoc_09"
            target="_blank"
            rel="noopener noreferrer"
        >
            Telegram
        </a>

        <a
            class="link"
            href="https://linkbio.co/8070700OwKBiF"
            target="_blank"
            rel="noopener noreferrer"
        >
            Link Bio
        </a>

    </div>

</main>


<!-- =========================
     NÚT NHẠC
========================= -->

<button
    class="music-button"
    id="musicButton"
    aria-label="Bật hoặc tắt nhạc"
>
    🔇
</button>

<audio
    id="music"
    loop
    preload="auto"
>
    <source
        src="tiktok_mp3.mp3"
        type="audio/mpeg"
    >
</audio>


<script>

/* =========================
   HIỆU ỨNG CHẠM NÚT
========================= */

document.querySelectorAll(".link").forEach(function(button) {

    button.addEventListener("click", function(event) {

        const circle = document.createElement("span");

        const rect = button.getBoundingClientRect();

        const size = Math.max(
            rect.width,
            rect.height
        );

        circle.classList.add("ripple");

        circle.style.width = size + "px";
        circle.style.height = size + "px";

        circle.style.left =
            (event.clientX - rect.left - size / 2) + "px";

        circle.style.top =
            (event.clientY - rect.top - size / 2) + "px";

        button.appendChild(circle);

        setTimeout(function() {
            circle.remove();
        }, 600);

    });

});


/* =========================
   NHẠC
========================= */

const music =
    document.getElementById("music");

const musicButton =
    document.getElementById("musicButton");


musicButton.addEventListener("click", function() {

    if (music.paused) {

        music.play()
            .then(function() {

                musicButton.textContent = "🔊";

            })
            .catch(function() {

                musicButton.textContent = "🔇";

            });

    } else {

        music.pause();

        musicButton.textContent = "🔇";

    }

});

</script>

</body>
    </html>
