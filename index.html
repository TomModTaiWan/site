<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TomModTaiWan | Profile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    color:white;
    min-height:100vh;
    background:
    radial-gradient(circle at 50% 15%,rgba(0,229,255,.16),transparent 35%),
    radial-gradient(circle at 10% 90%,rgba(120,70,255,.12),transparent 30%),
    #080b12;
}

a{
    text-decoration:none;
    color:inherit;
}

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:10;
    padding:16px 5%;
    background:rgba(8,11,18,.75);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.nav-inner{
    max-width:920px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:21px;
    font-weight:bold;
    color:#00e5ff;
}

nav a{
    color:#aaa;
    margin-left:20px;
    font-size:14px;
}

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:110px 20px 70px;
}

.card{
    width:min(720px,100%);
    padding:42px 24px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:28px;
    background:rgba(255,255,255,.045);
    box-shadow:0 20px 70px rgba(0,0,0,.35);
}

.avatar{
    width:120px;
    height:120px;
    border-radius:50%;
    margin:0 auto 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:bold;
    background:linear-gradient(135deg,#00e5ff,#7b61ff);
    box-shadow:0 0 45px rgba(0,229,255,.25);
}

h1{
    font-size:38px;
    margin-bottom:8px;
}

.subtitle{
    color:#aaa;
    margin-bottom:24px;
}

.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:999px;
    color:#00e5ff;
    background:rgba(0,229,255,.08);
    border:1px solid rgba(0,229,255,.22);
    font-size:13px;
    margin-bottom:24px;
}

.links{
    display:grid;
    gap:13px;
}

.link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:15px 18px;
    border-radius:15px;
    background:#111722;
    border:1px solid rgba(255,255,255,.08);
    transition:.2s;
    font-weight:bold;
}

.link:hover{
    transform:translateY(-2px);
    border-color:#00e5ff;
    color:#00e5ff;
}

.music{
    margin-top:24px;
    padding:18px;
    border-radius:18px;
    background:rgba(0,229,255,.06);
    border:1px solid rgba(0,229,255,.12);
}

.music p{
    font-size:13px;
    color:#aaa;
    margin-bottom:10px;
}

audio{
    width:100%;
}

footer{
    text-align:center;
    color:#666;
    padding:30px 15px;
    font-size:13px;
}

@media(max-width:600px){
    h1{
        font-size:30px;
    }

    .card{
        padding:32px 18px;
    }

    nav a{
        margin-left:10px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<nav>
    <div class="nav-inner">
        <div class="logo">TomModTaiWan</div>

        <div>
            <a href="#home">Home</a>
            <a href="#links">Links</a>
        </div>
    </div>
</nav>

<main id="home" class="hero">

<section class="card">

    <div class="avatar">
        TM
    </div>

    <h1>TomModTaiWan</h1>

    <p class="subtitle">
        Welcome to my personal profile ✨
    </p>

    <span class="badge">
        ● ONLINE
    </span>

    <div id="links" class="links">

        <a class="link"
        href="https://www.facebook.com/share/1cQg31DP2L/"
        target="_blank">
        🔵 Facebook
        </a>

        <a class="link"
        href="https://www.tiktok.com/@tluocc_010"
        target="_blank">
        🎵 TikTok
        </a>

        <a class="link"
        href="https://discord.gg/xhc"
        target="_blank">
        💬 Discord
        </a>

        <a class="link"
        href="https://t.me/YOUR_TELEGRAM"
        target="_blank">
        ✈️ Telegram
        </a>

        <a class="link"
        href="https://linkbio.co/YOUR_LINKBIO"
        target="_blank">
        🔗 LinkBio
        </a>

    </div>

    <div class="music">

        <p>🎧 My Music</p>

        <audio controls preload="none">
            <source src="music.mp3" type="audio/mpeg">
            Trình duyệt của bạn không hỗ trợ phát nhạc.
        </audio>

        <p>
            Đặt file nhạc tên là music.mp3 trong repository
            để phát nhạc.
        </p>

    </div>

</section>

</main>

<footer>
© 2026 TomModTaiWan • Made with ❤️
</footer>

</body>
  </html>
