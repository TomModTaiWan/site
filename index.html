<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>𝙏𝙤𝙢𝙈𝙤𝙙𝙏𝙖𝙞𝙒𝙖𝙣</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }

    /* VIDEO BACKGROUND */
    .video-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -3;
    }

    /* DARK OVERLAY */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.42);
      z-index: -2;
    }

    /* MAIN */
    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .profile {
      width: min(420px, 94vw);
      text-align: center;
      color: white;
      animation: fadeIn 1.2s ease;
    }

    /* AVATAR */
    .avatar {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.95);
      box-shadow:
        0 0 20px rgba(255,255,255,0.35),
        0 0 45px rgba(255,255,255,0.15);
      margin-bottom: 18px;
    }

    /* NAME */
    .name {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;

      text-shadow:
        2px 2px 0 #000,
        -2px -2px 0 #000,
        2px -2px 0 #000,
        -2px 2px 0 #000,
        0 0 12px rgba(255,255,255,0.35);

      margin-bottom: 8px;
    }

    /* VERIFIED */
    .verified {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: #1d9bf0;
      border-radius: 50%;
      color: white;
      font-size: 13px;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(29,155,240,0.5);
    }

    .verified::after {
      content: "✓";
      transform: translateY(-0.5px);
    }

    /* BIO */
    .bio {
      font-size: 14px;
      opacity: 0.95;
      margin-bottom: 22px;

      text-shadow:
        1px 1px 0 #000,
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000;
    }

    /* SOCIAL LINKS */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link {
      display: block;
      width: 100%;
      padding: 14px 18px;

      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;

      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 14px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .link:hover {
      transform: translateY(-3px) scale(1.02);
      background: rgba(255,255,255,0.16);
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .link:active {
      transform: scale(0.97);
    }

    /* MUSIC BUTTON */
    .music-button {
      position: fixed;
      right: 18px;
      bottom: 18px;

      width: 45px;
      height: 45px;

      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 50%;

      background: rgba(0,0,0,0.5);
      color: white;

      cursor: pointer;
      font-size: 18px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      z-index: 10;
    }

    .music-button:hover {
      background: rgba(255,255,255,0.18);
    }

    /* FADE */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* MOBILE */
    @media (max-width: 480px) {
      .avatar {
        width: 135px;
        height: 135px;
      }

      .name {
        font-size: 21px;
      }

      .verified {
        width: 18px;
        height: 18px;
        font-size: 12px;
      }

      .bio {
        font-size: 13px;
      }

      .link {
        padding: 13px 15px;
      }
    }
  </style>
</head>

<body>

  <!-- VIDEO -->
  <video
    id="backgroundVideo"
    class="video-background"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source src="background.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <!-- PROFILE -->
  <main class="container">
    <section class="profile">

      <img
        src="avatar.png"
        alt="Avatar"
        class="avatar"
      >

      <h1 class="name">
        𝙏𝙤𝙢𝙈𝙤𝙙𝙏𝙖𝙞𝙒𝙖𝙣
        <span class="verified"></span>
      </h1>

      <p class="bio">
        Welcome to my profile ✨
      </p>

      <div class="links">

        <a
          class="link"
          href="https://www.facebook.com/share/1cQg31DP2L/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Facebook
        </a>

        <a
          class="link"
          href="https://www.tiktok.com/@tluocc_010"
          target="_blank"
          rel="noopener noreferrer"
        >
          TikTok
        </a>

        <a
          class="link"
          href="https://discord.gg/xhc"
          target="_blank"
          rel="noopener noreferrer"
        >
          Discord
        </a>

      </div>

    </section>
  </main>

  <!-- MUSIC / VIDEO SOUND -->
  <button
    class="music-button"
    id="musicButton"
    aria-label="Bật hoặc tắt âm thanh"
  >
    🔇
  </button>

  <script>
    const video = document.getElementById("backgroundVideo");
    const musicButton = document.getElementById("musicButton");

    musicButton.addEventListener("click", () => {
      video.muted = !video.muted;

      if (video.muted) {
        musicButton.textContent = "🔇";
      } else {
        musicButton.textContent = "🔊";
        video.play().catch(() => {});
      }
    });

    // Đảm bảo video tự phát khi trình duyệt cho phép
    video.play().catch(() => {});
  </script>

</body>
  </html>
