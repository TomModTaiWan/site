<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TomMod | Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% 20%,rgba(126,55,255,.18),transparent 35%),
    radial-gradient(circle at 10% 90%,rgba(75,0,180,.16),transparent 35%),
    #070312;
}
.header{
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:14px;
  padding:16px 20px;
  background:rgba(13,6,32,.88);
  border-bottom:1px solid rgba(150,90,255,.18);
  backdrop-filter:blur(14px);
}
.menu{
  width:48px;height:48px;border-radius:15px;
  display:grid;place-items:center;
  font-size:25px;background:#10082a;
  border:1px solid rgba(170,110,255,.18);
}
.logo{
  width:46px;height:46px;border-radius:50%;
  object-fit:cover;border:2px solid rgba(170,100,255,.5);
}
.brand{flex:1}
.brand b{display:block;font-size:18px}
.brand span{color:#9b8ab7;font-size:13px}
.telegram{
  text-decoration:none;color:#fff;font-weight:700;
  padding:13px 18px;border-radius:15px;
  background:linear-gradient(135deg,#7b3cff,#5d46ff);
  box-shadow:0 8px 28px rgba(105,60,255,.28);
}
.hero{text-align:center;padding:72px 20px 58px}
.avatar{
  width:155px;height:155px;
  object-fit:cover;border-radius:50%;
  display:block;margin:0 auto 25px;
  border:5px solid rgba(142,72,255,.7);
  box-shadow:0 0 30px rgba(126,57,255,.45);
}
.hi{color:#9e91b8;font-size:22px;margin-bottom:12px}
h1{font-size:42px;line-height:1.1;margin-bottom:14px}
.verify{color:#1595ff;font-size:28px}
.bio{
  color:#a79abf;font-size:22px;
  max-width:600px;margin:auto;
}
.socials{
  display:flex;justify-content:center;gap:18px;margin-top:30px;
}
.social{
  width:64px;height:64px;border-radius:20px;
  display:grid;place-items:center;
  text-decoration:none;color:#fff;
  font-weight:800;font-size:16px;
  background:linear-gradient(145deg,#19102f,#0d071d);
  border:1px solid rgba(160,100,255,.28);
  box-shadow:0 10px 28px rgba(0,0,0,.35);
  transition:.2s;
}
.social:hover{transform:translateY(-4px);border-color:#8d55ff}
.fb{font-size:28px;color:#4795ff}
.section{
  max-width:900px;margin:auto;padding:55px 20px 80px;
  border-top:1px solid rgba(150,90,255,.14);
}
.section h2{
  font-size:42px;line-height:1.15;margin-bottom:28px;
}
.section h2 span{
  background:linear-gradient(90deg,#fff,#a05cff,#6250ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.card{
  padding:24px;border-radius:22px;
  background:rgba(18,8,39,.72);
  border:1px solid rgba(150,90,255,.18);
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}
.card a{color:#c5a5ff;text-decoration:none}
@media(max-width:600px){
  .header{padding:13px 14px}
  .telegram{padding:12px 13px;font-size:13px}
  .avatar{width:135px;height:135px}
  h1{font-size:34px}
  .section h2{font-size:34px}
}
</style>
</head>
<body>

<header class="header">
  <div class="menu">☰</div>
  <img class="logo" src="avatar.png" alt="TomMod">
  <div class="brand">
    <b>TomMod</b>
    <span>tommod.no1</span>
  </div>
  <a class="telegram" href="https://t.me/" target="_blank">✈ Join Telegram</a>
</header>

<main>
  <section class="hero">
    <img class="avatar" src="avatar.png" alt="TomMod avatar">
    <div class="hi">Hi, i am</div>
    <h1>TomMod <span class="verify">✓</span></h1>
    <div class="bio">Nền tảng tiện ích của TomMod</div>

    <div class="socials">
      <a class="social" href="https://t.me/" target="_blank" aria-label="Telegram">✈</a>
      <a class="social fb" href="https://www.facebook.com/share/1cQg31DP2L/" target="_blank" aria-label="Facebook">f</a>
    </div>
  </section>

  <section class="section">
    <h2>Bộ Sưu Tập <span>Ứng dụng</span></h2>
    <div class="card">
      <p>Chào mừng đến với website của <b>TomMod</b>.</p>
      <p style="margin-top:10px;color:#9f93b5">Website: <b style="color:#c7a9ff">tommod.no1</b></p>
    </div>
  </section>
</main>

</body>
</html>
